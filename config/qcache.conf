# qcache - what to look for, and where.
#
# Runs on the host; container processes are visible through /proc like any
# others, so no container runtime is required.

control_path = /tmp/qcache.sock
valkey_host  = valkey
valkey_port  = 6379

# The demo workload. Every matcher is a case-insensitive substring; a target
# with no matchers at all is rejected, since it would match every process on
# the host.
[target demo-workload]
comm       = python3
cmdline    = loop_client
container  = vebpf-bpf
mysql_port = 3306
statements = config/cache.list
ttl        = 60

[target mysql-cli]
comm       = mysql
container  = vebpf-bpf
mysql_port = 3306
statements = config/cache.list
ttl        = 60
