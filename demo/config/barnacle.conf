# barnacle - what to cache, where the cache is, and what to attach to.
#
# Runs on the barnacle host; container processes are visible through /proc
# like any others, so no container runtime is required.

# --- the daemon ----------------------------------------------------------
#
# `barnacle start-server` builds the daemon's command line from these.

valkey_host = valkey
valkey_port = 6379

# The statement list, and how long a cached response stays good for. This is
# the file to edit when a slow query turns up; `barnacle reload-config` then
# carries the change to the daemon and to every attached client.
statements  = demo/config/cache.list
ttl         = 60

# Which port counts as MySQL, for classifying connections.
mysql_port  = 3306

# There are two cache tiers: Valkey, which every host shares, and a per-host
# copy in the BPF arena that each attached process has mapped. A hit in the
# arena is a memory read, so it costs no round trip -- and sends no command,
# which is why the Valkey MONITOR window is quiet while the demo is fast.
#
# Uncomment to give that up and send EVERY lookup to Valkey. Slower, but the
# shared copy becomes the only authority, and every hit shows up in MONITOR.
# `barnacle reload-config` applies it without restarting anything.
#
# local_cache = off

# --- what to attach to ---------------------------------------------------
#
# `bin` is an exact, case-insensitive match on the program's name -- never a
# substring, so `mysql` does not also match `mysqld`. A leading path is
# trimmed; what is compared is /proc/<pid>/comm, truncated to 15 characters by
# the kernel. `cmdline` and `container` are case-insensitive substrings. A
# target with no matchers at all is rejected, since it would match every
# process on the host.

[target demo-client]
bin       = python3
cmdline   = app.py
container = bncl-client

# The mysql CLI, if you want to watch a second, completely different client
# get the same treatment. It uses SSL_read/SSL_write while Python uses the
# _ex variants, which is exactly why the agent hooks both families.
[target mysql-cli]
bin       = mysql
container = bncl-ctl
