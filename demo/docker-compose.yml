# The demo stack: MySQL, Valkey, and a privileged build/run container.
#
# The project name is pinned rather than derived. Compose defaults it to the
# directory holding this file -- "demo" -- which makes every documented
# `docker compose -f demo/docker-compose.yml ...` depend on where it is run
# from, and silently target a different project than the one already up.
# Naming it here means the commands in the README work from anywhere.
name: barnacle

services:
  mysql:
    image: mysql:8.4
    container_name: bncl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: shop
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
    # mysql_native_password is off by default in 8.4; re-enabling it keeps the
    # demo's auth simple. TLS is no longer a problem for us: the cache
    # intercepts inside the client, above its TLS library, so encrypted
    # connections are the normal case rather than a blind spot.
    #
    # The general query log is ON for the demo, and logs EVERY statement the
    # server is asked to run. That is the point: the claim being demonstrated
    # is that a cached statement never reaches mysqld, and the only way to see
    # that from the server's side is to have the server report everything it
    # was asked. Written to a fixed path rather than the default, which is
    # named after the container's hostname and so changes whenever the
    # container is recreated.
    #
    # A debugging setting, not a production one: it writes a line per
    # statement and grows without bound. It is here because this stack exists
    # to be watched.
    command:
      - "--mysql-native-password=ON"
      - "--general-log=ON"
      - "--general-log-file=/var/lib/mysql/general.log"
    ports:
      - "13306:3306"
    volumes:
      - ./seed_mysql.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    # valkey-bundle ships the valkey-search module (FT.CREATE / FT.SEARCH).
    image: valkey/valkey-bundle:latest
    container_name: bncl-valkey
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Valkey Admin -- the official web UI (valkey-io/valkey-admin).
  #
  # Here for one reason: the terminal panes show cache traffic as it happens,
  # and nothing shows it as a RATE. This does -- command throughput, hit
  # ratio, connected clients, memory -- plus a key browser that lists the
  # `bncl:` keys and renders the cached result set behind each one.
  #
  # It watches; it is not part of the cache. Barnacle neither knows nor cares
  # that it is there, and the demo works with this service stopped.
  #
  # NOTE: with the local tier on (the default), a cache hit is served from
  # this host's arena and sends Valkey nothing -- so the throughput graph sits
  # at zero however hard the client is working. That is the design, not a
  # fault. Set `local_cache = off` in demo/config/barnacle.conf and reload to
  # route every lookup through Valkey and make this dashboard move.
  valkey-admin:
    image: valkey/valkey-admin:latest
    container_name: bncl-admin
    ports:
      - "18080:8080"
    environment:
      DEPLOYMENT_MODE: Web
      # Pre-wired, so the UI opens straight onto this stack's Valkey rather
      # than asking for a host on first load.
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      # A cached result set is a few KB of MySQL wire protocol; the default
      # 2048 would truncate exactly the values worth looking at.
      KEY_VALUE_SIZE_LIMIT_BYTES: "65536"
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy

  # The client application: a sealed program that knows nothing about the
  # cache, in its own container and its own image. Everything the cache does
  # to it is done from outside, to a process that is already running -- which
  # is the claim the whole demo exists to show.
  #
  # It is given two things it would not otherwise have, and both are
  # consequences of the architecture rather than conveniences:
  #
  #   /sys/fs/bpf  the agent runs INSIDE this process, with this process's
  #                credentials, and opens the maps the daemon pinned. It
  #                cannot open a pin it cannot see.
  #   cap_add      and it cannot call bpf(2) without CAP_BPF. On a host
  #                deployment this question does not come up in the same form:
  #                the pins are simply there, and the caps are whatever the
  #                target process already has.
  #
  # Note what is NOT here: no volume from this repository, no build output, no
  # statement list. barnacle puts the agent and the list inside this container
  # at attach time, by writing through /proc/<pid>/root.
  client:
    build:
      context: ./client
    container_name: bncl-client
    cap_add:
      - BPF
      - PERFMON
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
      MYSQL_DB: shop
    restart: unless-stopped
    # A pty and an open stdin, so the client's display can be driven from the
    # keyboard: `docker attach` connects to it and +/- change how often the
    # frame repaints. `docker logs -f` is a one-way stream with no keyboard
    # behind it, which is why this is needed at all -- and why the client
    # works perfectly well without anyone attaching.
    stdin_open: true
    tty: true
    depends_on:
      mysql:
        condition: service_healthy

  # The controller: where the daemon runs and where `barnacle` is typed.
  #
  # Named ctl rather than bpf because "bpf" describes how one component is
  # built rather than what this container is for -- and rather than host,
  # because `pid: host` a few lines down would read very badly in a service
  # called host.
  #
  # It has supervisor access to the client -- host PID namespace so it can see
  # the client's processes, and the privilege to ptrace one and write to its
  # /proc/<pid>/root. It has no such relationship with mysql or valkey; it
  # talks to valkey as an ordinary client and never talks to mysql at all.
  ctl:
    build:
      context: ./ctl
    container_name: bncl-ctl
    # eBPF needs to load programs and read kernel BTF; host PID namespace lets
    # the tracer see clients running in the other containers.
    privileged: true
    pid: host
    volumes:
      # Repo root, one level up from this compose file, mounted whole so the
      # container can build and run the actual project, not just the demo.
      - ..:/workspace
      # Retained for eBPF experiments under spike/; the cache itself needs
      # neither of these, nor any kernel support at all.
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: app
      MYSQL_PASSWORD: apppw
      MYSQL_DB: shop
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      # So the control window is `barnacle status` rather than
      # `./build/barnacle -c demo/config/barnacle.conf status` every time.
      # Both are conveniences for the demo; neither is needed to run barnacle.
      BARNACLE_CONF: /workspace/demo/config/barnacle.conf
      PATH: "/workspace/build:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    working_dir: /workspace
    command: ["sleep", "infinity"]

# One user-defined bridge, named, so `demo/netem.sh` can find the interface it
# has to shape without guessing which of docker's generated networks is ours.
networks:
  default:
    name: bncl-net
